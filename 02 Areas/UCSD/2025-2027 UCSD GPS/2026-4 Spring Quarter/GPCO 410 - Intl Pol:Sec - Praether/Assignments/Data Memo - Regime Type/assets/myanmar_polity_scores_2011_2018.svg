<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Myanmar Polity5 regime scores, 2011-2018</title>
  <desc id="desc">Line chart showing DEMOC, AUTOC, and polity2 scores for Myanmar from 2011 to 2018, with 2015 marked as a transition year.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Myanmar Polity5 Regime Scores, 2011-2018</text>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="14" fill="#555">Raw annual DEMOC and AUTOC components, plus total score using polity2</text>

  <rect x="465" y="90" width="90" height="330" fill="#d9d9d9" opacity="0.38"/>
  <text x="510" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">2015 transition</text>
  <text x="510" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">raw polity = -88</text>

  <line x1="70" y1="420" x2="820" y2="420" stroke="#222" stroke-width="1.5"/>
  <line x1="70" y1="90" x2="70" y2="420" stroke="#222" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="12" fill="#555">
    <line x1="70" y1="420" x2="820" y2="420" stroke="#e6e6e6"/>
    <text x="55" y="424" text-anchor="end">-4</text>
    <line x1="70" y1="373" x2="820" y2="373" stroke="#e6e6e6"/>
    <text x="55" y="377" text-anchor="end">-2</text>
    <line x1="70" y1="326" x2="820" y2="326" stroke="#b9b9b9"/>
    <text x="55" y="330" text-anchor="end">0</text>
    <line x1="70" y1="279" x2="820" y2="279" stroke="#e6e6e6"/>
    <text x="55" y="283" text-anchor="end">2</text>
    <line x1="70" y1="231" x2="820" y2="231" stroke="#e6e6e6"/>
    <text x="55" y="235" text-anchor="end">4</text>
    <line x1="70" y1="184" x2="820" y2="184" stroke="#e6e6e6"/>
    <text x="55" y="188" text-anchor="end">6</text>
    <line x1="70" y1="137" x2="820" y2="137" stroke="#e6e6e6"/>
    <text x="55" y="141" text-anchor="end">8</text>
    <line x1="70" y1="90" x2="820" y2="90" stroke="#e6e6e6"/>
    <text x="55" y="94" text-anchor="end">10</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" fill="#444">
    <text x="90" y="445" text-anchor="middle">2011</text>
    <text x="196" y="445" text-anchor="middle">2012</text>
    <text x="303" y="445" text-anchor="middle">2013</text>
    <text x="410" y="445" text-anchor="middle">2014</text>
    <text x="516" y="445" text-anchor="middle">2015</text>
    <text x="623" y="445" text-anchor="middle">2016</text>
    <text x="730" y="445" text-anchor="middle">2017</text>
    <text x="820" y="445" text-anchor="middle">2018</text>
  </g>

  <polyline points="90,326 196,326 303,326 410,326 516,326 623,137 730,137 820,137" fill="none" stroke="#2f7d32" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="90,255 196,255 303,255 410,255 516,326 623,326 730,326 820,326" fill="none" stroke="#9f3a38" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="90,397 196,397 303,397 410,397 516,279 623,137 730,137 820,137" fill="none" stroke="#234f8f" stroke-width="4" stroke-linejoin="round"/>

  <g fill="#2f7d32"><circle cx="90" cy="326" r="5"/><circle cx="196" cy="326" r="5"/><circle cx="303" cy="326" r="5"/><circle cx="410" cy="326" r="5"/><circle cx="516" cy="326" r="5"/><circle cx="623" cy="137" r="5"/><circle cx="730" cy="137" r="5"/><circle cx="820" cy="137" r="5"/></g>
  <g fill="#9f3a38"><circle cx="90" cy="255" r="5"/><circle cx="196" cy="255" r="5"/><circle cx="303" cy="255" r="5"/><circle cx="410" cy="255" r="5"/><circle cx="516" cy="326" r="5"/><circle cx="623" cy="326" r="5"/><circle cx="730" cy="326" r="5"/><circle cx="820" cy="326" r="5"/></g>
  <g fill="#234f8f"><circle cx="90" cy="397" r="5"/><circle cx="196" cy="397" r="5"/><circle cx="303" cy="397" r="5"/><circle cx="410" cy="397" r="5"/><circle cx="516" cy="279" r="5"/><circle cx="623" cy="137" r="5"/><circle cx="730" cy="137" r="5"/><circle cx="820" cy="137" r="5"/></g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#333">
    <rect x="575" y="470" width="16" height="4" fill="#2f7d32"/><text x="600" y="476">Democracy (DEMOC)</text>
    <rect x="575" y="493" width="16" height="4" fill="#9f3a38"/><text x="600" y="499">Autocracy (AUTOC)</text>
    <rect x="735" y="470" width="16" height="4" fill="#234f8f"/><text x="760" y="476">Total (polity2)</text>
  </g>
</svg>
