version: '3.9'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  scraper:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./etl:/app/etl
      - ./db:/app/db
      - ./tests:/app/tests
    command: tail -f /dev/null
volumes:
  pgdata:
